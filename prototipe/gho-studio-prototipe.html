<title>Gho Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sidebar kiri (desktop) / navigasi bawah (HP). Satu akun, tiga tampilan peran. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eef2f0; --line:#dbe2df;
  --ink:#14211d; --ink-2:#4b5b56; --ink-3:#7a8a85;
  --brand:#0f5c4d; --brand-ink:#ffffff; --brand-soft:#dcefe9;
  --accent:#d98b16; --accent-soft:#fbefd9;
  --ai:#2f6fd6; --ai-soft:#e3edfc;
  --good:#1f8a4c; --good-soft:#dff3e6; --warn:#b7791f; --warn-soft:#fcf1dc; --bad:#c2410c; --bad-soft:#fde7dc;
  --shadow:0 1px 2px rgba(20,33,29,.06),0 4px 16px rgba(20,33,29,.06);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#151f1c; --surface-2:#1b2825; --line:#283733;
  --ink:#e6eeeb; --ink-2:#a9bab5; --ink-3:#7d8f8a;
  --brand:#3fb59a; --brand-ink:#05211b; --brand-soft:#173a32;
  --accent:#f0a93a; --accent-soft:#3a2c14;
  --ai:#7aa7f5; --ai-soft:#1b2a44;
  --good:#4cc47f; --good-soft:#143322; --warn:#e6b25a; --warn-soft:#3a2d14; --bad:#f08a5d; --bad-soft:#3d2016;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#151f1c; --surface-2:#1b2825; --line:#283733;
  --ink:#e6eeeb; --ink-2:#a9bab5; --ink-3:#7d8f8a;
  --brand:#3fb59a; --brand-ink:#05211b; --brand-soft:#173a32;
  --accent:#f0a93a; --accent-soft:#3a2c14;
  --ai:#7aa7f5; --ai-soft:#1b2a44;
  --good:#4cc47f; --good-soft:#143322; --warn:#e6b25a; --warn-soft:#3a2d14; --bad:#f08a5d; --bad-soft:#3d2016;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:18px}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
.logo b{font-size:16px;letter-spacing:-.01em} .logo small{display:block;font-size:11px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav svg{width:18px;height:18px;flex:none}
.nav .grp{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 4px}
.nav .grp:first-child{padding-top:4px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .pane{width:100%;background:var(--surface);border-radius:18px 18px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet .pane::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet .nav a{padding:12px 10px}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 6px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.roles{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.roles button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer}
.roles button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.saved{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--good);font-weight:600;white-space:nowrap}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.saved.busy{color:var(--warn)} .saved.busy i{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn svg{width:18px;height:18px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px}
.content{padding-block:22px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1240px;width:100%;display:flex;flex-direction:column;gap:18px}
.proto svg{width:14px;height:14px;flex:none}
.proto{font-size:12px;color:var(--ai);background:var(--ai-soft);border-radius:8px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center;align-self:flex-start}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin-top:4px}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.pad0{padding:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.split.rev{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.stat .d{font-size:12px;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ai{background:var(--ai-soft);color:var(--ai)} .chip.brand{background:var(--brand-soft);color:var(--brand)} .chip.accent{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700}
.li .s{font-size:12.5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13px}
.field .hint{font-size:12px;color:var(--ink-3)}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.ai-box{border:1px solid color-mix(in srgb,var(--ai) 35%,var(--line));background:linear-gradient(0deg,var(--surface),var(--surface)),var(--ai-soft);border-radius:var(--r);padding:14px 16px}
.ai-head{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ai);font-size:13px;margin-bottom:8px}
.ai-head svg{width:16px;height:16px}
.ai-text{white-space:pre-wrap}
.typing::after{content:"▍";color:var(--ai);animation:pulse .8s infinite}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bnav{display:none}

/* stepper */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:110px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);cursor:pointer;text-align:left}
.step small{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.step b{font-size:12.5px}
.step.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.step.done small{color:var(--good)}

/* case chat */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.msg.me{align-self:flex-end;background:var(--brand-soft);border-color:transparent}
.msg.cond{border-left:4px solid var(--accent);background:var(--surface)}
.msg .meta{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.rounds{display:flex;gap:6px}
.rounds i{width:28px;height:6px;border-radius:9px;background:var(--surface-2)}
.rounds i.on{background:var(--accent)}

/* quiz */
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink-3)}
.opt b{width:24px;height:24px;flex:none;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:12px}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* slides */
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.slide{aspect-ratio:16/9;max-width:100%;border-radius:10px;background:var(--brand);color:var(--brand-ink);padding:12px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}
.slide:nth-child(even){background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.slide b{font-size:13px;line-height:1.3}

/* poll */
.pollrow{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center}
.pollrow .bar{height:26px;border-radius:8px}
.pollrow .bar>span{background:var(--accent);border-radius:8px}
.pollrow .bar{position:relative}
.pollrow .bar em{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:700;font-size:12.5px;color:var(--ink)}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:center;padding:10px}
.cloud span{font-weight:800;color:var(--brand)}
.cloud span:nth-child(3n){color:var(--accent)} .cloud span:nth-child(4n){color:var(--ai)}
.code{font-family:var(--f-mono);font-size:30px;font-weight:600;letter-spacing:.12em;color:var(--brand)}
.cat{display:flex;flex-direction:column;gap:8px}
.cat .tr{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.sel{cursor:pointer}
.sel.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}


/* tombol geser */
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.sw input:checked{background:var(--brand)} .sw input:checked::after{left:20px}
/* editor teks lengkap */
.ed{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ed .edmode{padding:0 8px;background:var(--surface-2)}
.ed-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:2}
.ed-bar .gp{display:flex;gap:2px;padding-right:6px;margin-right:4px;border-right:1px solid var(--line)}
.ed-bar .gp:last-child{border-right:0}
.ed-bar button{min-width:30px;height:30px;border:0;border-radius:7px;background:none;color:var(--ink);cursor:pointer;font:600 13px var(--f-ui);display:grid;place-items:center;padding:0 6px}
.ed-bar button:hover{background:var(--surface)} .ed-bar button.on{background:var(--brand-soft);color:var(--brand)}
.ed-bar select{height:30px;width:auto;padding:0 6px;font-size:12.5px;border-radius:7px}
.ed-bar input[type=color]{width:30px;height:30px;padding:2px;border:0;background:none;cursor:pointer}
.ed-bar .eqb{background:var(--ai-soft);color:var(--ai);padding:0 10px}
.ed-area{min-height:220px;padding:14px 16px;outline:none;line-height:1.65;overflow-wrap:anywhere}
.ed-area:focus{box-shadow:inset 0 0 0 2px var(--brand-soft)}
.ed-area h2{font-size:18px;margin:8px 0 4px} .ed-area h3{font-size:15.5px;margin:8px 0 4px}
.ed-area blockquote{border-left:3px solid var(--brand);margin:6px 0;padding:2px 12px;color:var(--ink-2)}
.ed-area ul,.ed-area ol{padding-left:22px;margin:4px 0}
.ed-area table{border-collapse:collapse;margin:8px 0;width:100%}
.ed-area td,.ed-area th{border:1px solid var(--line);padding:6px 8px;min-width:50px}
.ed-area .eq{display:inline-block;padding:2px 6px;margin:0 2px;border-radius:6px;background:var(--ai-soft);cursor:pointer;vertical-align:middle;font-family:"Times New Roman",serif;font-size:16px}
.ed-area .eq .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em}
.ed-area .eq .frac>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.ed-foot{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.ed-pop{border-bottom:1px solid var(--line);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.ed-pop[hidden]{display:none}
.ed-pop .syms{display:flex;flex-wrap:wrap;gap:4px}
.ed-pop .syms button{width:34px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;font-size:15px;color:var(--ink)}
.ed-pop math-field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:20px;background:var(--surface);color:var(--ink)}
.eqprev{min-height:34px;padding:6px 10px;border-radius:8px;background:var(--surface-2);font-family:"Times New Roman",serif;font-size:17px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;color:var(--ink-2);margin:12px}
.drop:hover{border-color:var(--brand)} .drop input{display:none}

/* media sosial */
.plat{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.plat.on{border-color:var(--brand);background:var(--brand-soft)}
.plat .pl{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.plat input{margin-left:auto;width:18px;height:18px;accent-color:var(--brand)}
.pstat{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center}
/* kuis beragam */
.bst{width:100%;border-collapse:collapse}.bst td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.bst .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bst .seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.bst .seg button.on{background:var(--brand);color:var(--brand-ink)}
.bst tr.ok td{background:var(--good-soft)} .bst tr.no td{background:var(--bad-soft)}
.urut{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.urut .n{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.urut button{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;cursor:pointer;color:var(--ink)}
.jod{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
@media (max-width:520px){.jod{grid-template-columns:minmax(0,1fr)}}
.qtype{display:flex;flex-wrap:wrap;gap:6px}
.qtype label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.qtype input{accent-color:var(--brand)}
/* materi wajib */
.path{display:flex;flex-direction:column;gap:8px}
.pstep{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.pstep .ix{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.pstep .ix svg{width:16px;height:16px}

      stream(document.getElementById('stxt'), teks, () => document.getElementById('sact').hidden = false);

window.kirimKasus = () => {

  document.getElementById('kirim').disabled = true; markSaving();
  const n = kasusLog.filter(m=>m.r==='me').length;
  setTimeout(() => { // 1) simpan dulu
    kasusLog.push({r:'me', x, t:jam()}); store.set('kasus', kasusLog); draft.kasus=''; store.set('draft', draft); render();
    const slot = document.getElementById('aislot');
    slot.innerHTML = `<div class="msg"><div class="meta"><span class="chip ai">Tanggapan</span></div><p class="ai-text" id="aitxt"></p></div>`;
    const snip = x.length>70 ? x.slice(0,70)+'…' : x;
    const fbs = [
      `Kamu memulai dengan "${snip}". Langkah ini menunjukkan orientasi pelayanan karena berangkat dari keluhan pasien. Yang belum terlihat: data apa yang kamu pakai untuk membuktikan perbaikan. Simpan angka 75 menit sebagai kondisi awal.`,
      `Penyesuaianmu "${snip}" realistis untuk tenaga yang tinggal sepertiga. Kamu juga merespon isu viral, ini sejalan dengan nilai Adaptif dan Harmonis. Pertimbangkan siapa yang berbicara ke warga agar pesannya satu.`,
      `Rencana cadanganmu "${snip}" bisa jalan tanpa biaya. Pastikan pencatatan manual nanti dipindahkan ke SIMPUS agar data tidak hilang. Ini wujud nilai Akuntabel.`
    ];
    aiThinking(document.getElementById('aitxt'), 700, () => stream(document.getElementById('aitxt'), fbs[n], () => {
      kasusLog.push({r:'fb', x:fbs[n]});
      if(n < 2){ const tw = KASUS.twist[n]; kasusLog.push({r:'cond', tag:tw.tag, lvl:tw.lvl, x:tw.t}); }
      else kasusLog.push({r:'end', x:'Skor akhir 84/100\n• Ketepatan analisis 82 · Adaptasi 88 · BerAKHLAK 85 · Dampak layanan 80\n\nPola keputusanmu: kamu selalu mulai dari kebutuhan pasien lalu menyesuaikan dengan sumber daya. Area pengembangan: gunakan data untuk membuktikan dampak di setiap putaran. Hasil ini dikirim ke fasilitator untuk divalidasi.'});
      store.set('kasus', kasusLog); render(); window.scrollTo({top:document.body.scrollHeight, behavior: reduce?'auto':'smooth'});
    }));
  }, 500);
};

V['pes-kuis'] = () => { const K = KUIS2; const k = K[quizState.i];

  if(k.t==='urut' && !urutCur) urutCur = [3,0,4,1,2];

  if(k.t==='bs') body = `<table class="bst" id="bst">${k.st.map((x,j)=>`<tr><td>${x[0]}</td><td style="width:1%;white-space:nowrap"><span class="seg"><button class="${qa['b'+j]===true?'on':''}" onclick="qa['b'+${j}]=true;render()">B</button><button class="${qa['b'+j]===false?'on':''}" onclick="qa['b'+${j}]=false;render()">S</button></span></td></tr>`).join('')}</table>`;
  if(k.t==='jodoh') body = `<div class="stack">${k.kiri.map((x,j)=>`<div class="jod"><span>${x}</span><select id="jd${j}" onchange="qa['j'+${j}]=this.value"><option value="">Pilih…</option>${k.kanan.map((y,m)=>`<option value="${m}" ${qa['j'+j]==m?'selected':''}>${y}</option>`).join('')}</select></div>`).join('')}</div>`;
  if(k.t==='urut') body = `<div class="stack">${urutCur.map((x,j)=>`<div class="urut"><span class="n">${j+1}</span><span class="grow">${k.it[x]}</span><button aria-label="Naik" onclick="urutMv(${j},-1)">↑</button><button aria-label="Turun" onclick="urutMv(${j},1)">↓</button></div>`).join('')}</div>`;
  if(k.t==='isian') body = `<input type="text" id="isi" placeholder="Ketik jawabanmu" value="${esc(qa.isi||'')}" oninput="qa.isi=this.value">`;
  if(k.t==='alasan') body = `<div class="label">Tingkat 1 · Jawaban</div><div class="stack">${k.o.map((o,j)=>`<button class="opt" style="${qa.pg===j?'background:var(--brand-soft);border-color:var(--brand)':''}" onclick="qa.pg=${j};render()"><b>${'AB'[j]}</b><span>${o}</span></button>`).join('')}</div>
    <div class="label" style="margin-top:6px">Tingkat 2 · Alasan</div><div class="stack">${k.r.map((o,j)=>`<button class="opt" style="${qa.r===j?'background:var(--brand-soft);border-color:var(--brand)':''}" onclick="qa.r=${j};render()"><b>${j+1}</b><span>${o}</span></button>`).join('')}</div>`;

  stream(document.getElementById('ext'), (ok?'Tepat. ':'Belum tepat. ') + k.e); };

  if(kind==='eq'){ pop.innerHTML = `<div class="row" style="justify-content:space-between"><div class="label">Persamaan (seperti di Word)</div><span class="faint" style="font-size:12px" id="${id}-mls">${mlState==='ok'?'Papan ketik matematika siap':'Memuat papan ketik matematika…'}</span></div>
      <div class="row">${EQT.map(t=>`<button class="btn sm" type="button" onclick="eqIns('${id}',${JSON.stringify(t[1]).replace(/"/g,'&quot;')})">${t[0]}</button>`).join('')}</div>
      <div id="${id}-eqbox"></div><div class="row"><button class="btn sm primary" onclick="eqPut('${id}')">${ic('check')}Sisipkan ke teks</button>
      <button class="btn sm" onclick="try{mathVirtualKeyboard.show()}catch(e){toast('Papan ketik matematika belum termuat')}">Tampilkan papan ketik</button>
      <button class="btn sm ghost" onclick="document.querySelector('#${id} .ed-pop').hidden=true">Tutup</button></div>`;
    eqBox(id); loadML(() => eqBox(id)); }
};
function loadML(cb){ if(mlState==='ok'){ cb(); return; } if(mlState==='loading'){ document.addEventListener('ml-ready', cb, {once:true}); return; }
  mlState = 'loading'; document.addEventListener('ml-ready', cb, {once:true});
  const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/mathlive@0.101.0/dist/mathlive.min.js'; sc.defer = true;
  sc.onload = () => { mlState = customElements.get('math-field') ? 'ok' : 'fail'; document.dispatchEvent(new Event('ml-ready')); reEq(); };
  sc.onerror = () => { mlState = 'fail'; document.dispatchEvent(new Event('ml-ready')); };
  document.head.appendChild(sc); }
function eqBox(id){ const b = document.getElementById(id+'-eqbox'); if(!b) return; const cur = b.dataset.latex || '\\frac{x}{y}\\times 100\\%';
  const st = document.getElementById(id+'-mls'); if(st) st.textContent = mlState==='ok' ? 'Papan ketik matematika siap' : mlState==='fail' ? 'Mode LaTeX (papan ketik matematika tidak termuat)' : 'Memuat papan ketik matematika…';
  if(mlState==='ok'){ b.innerHTML = '<math-field id="'+id+'-mf"></math-field>'; const mf = document.getElementById(id+'-mf'); mf.value = cur; }
  else { b.innerHTML = `<input type="text" id="${id}-lx" class="mono" value="${esc(cur)}" oninput="document.getElementById('${id}-pv').innerHTML=eqRender(this.value)"><div class="eqprev" id="${id}-pv">${eqRender(cur)}</div>`; } }
window.eqIns = (id, lx) => { const mf = document.getElementById(id+'-mf'); if(mf){ mf.executeCommand(['insert', lx]); mf.focus(); return; }
  const i = document.getElementById(id+'-lx'); i.value = i.value ? i.value + ' ' + lx : lx; document.getElementById(id+'-pv').innerHTML = eqRender(i.value); };
window.eqPut = id => { const mf = document.getElementById(id+'-mf'); const lx = mf ? mf.value : document.getElementById(id+'-lx').value; if(!lx.trim()) return;
  const html = `<span class="eq" contenteditable="false" data-latex="${esc(lx)}">${eqRender(lx)}</span>`;
  if(window._eqEdit && window._eqEdit.isConnected){ window._eqEdit.outerHTML = html; window._eqEdit = null; edCount(id); } else edHTML(id, html + '&nbsp;');
  document.querySelector('#'+id+' .ed-pop').hidden = true; };
function eqRender(lx){
  if(mlState==='ok' && window.MathLive && MathLive.convertLatexToMarkup){ try{ return MathLive.convertLatexToMarkup(lx); }catch(e){} }
  let h = esc(lx);
  for(let k=0;k<3;k++) h = h.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '<span class="frac"><span>$1</span><span>$2</span></span>');
  return h.replace(/\\sqrt\{([^{}]*)\}/g,'√<span style="border-top:1px solid">$1</span>').replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^{}]*)\}/g,'<sub>$1</sub>')
    .replace(/\\sum/g,'Σ').replace(/\\int/g,'∫').replace(/\\times/g,'×').replace(/\\div/g,'÷').replace(/\\cdot/g,'·').replace(/\\le(q)?/g,'≤').replace(/\\ge(q)?/g,'≥')
    .replace(/\\pi/g,'π').replace(/\\alpha/g,'α').replace(/\\beta/g,'β').replace(/\\Delta/g,'Δ').replace(/\\text\{([^{}]*)\}/g,'$1').replace(/\\%/g,'%').replace(/\\,/g,' ').replace(/\\[a-zA-Z]+/g,'').replace(/[{}]/g,'');
}
function reEq(){ document.querySelectorAll('.ed-area .eq').forEach(e => { e.innerHTML = eqRender(e.dataset.latex); }); }
window.edEq = el => { /* klik persamaan untuk mengedit */ const id = el.closest('.ed').id; edPop(id,'eq'); setTimeout(()=>{ const b = document.getElementById(id+'-eqbox'); if(b){ b.dataset.latex = el.dataset.latex; eqBox(id); } window._eqEdit = el; }, 30); };
window.edMode = (b, id, m) => { b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  document.querySelector('#'+id+' .ed-ketik').hidden = m!=='ketik'; document.querySelector('#'+id+' .ed-unggah').hidden = m!=='unggah'; };
window.edFile = (inp, id) => { const f = inp.files[0]; if(!f) return; const out = document.getElementById(id+'-file');
  if(f.size > 5*1024*1024){ out.innerHTML = '<span class="chip bad">File lebih dari 5 MB</span>'; return; }
  out.innerHTML = `<div class="row" style="margin:0 12px 12px"><span class="chip good">✓ Siap dikirim</span><b>${esc(f.name)}</b><span class="faint mono">${Math.round(f.size/1024)} KB</span></div>`; markSaving(); };
const tb = (id, c, label, title, v) => `<button type="button" title="${title}" aria-label="${title}" onmousedown="event.preventDefault()" onclick="edCmd('${id}','${c}'${v?`,'${v}'`:''})">${label}</button>`;

          <div class="field"><label for="smv">Visibilitas YouTube</label><select id="smv"><option>Publik</option><option>Tidak publik</option><option>Pribadi</option></select></div></div>
        <div class="row"><button class="btn ai" onclick="smCap()">${ic('spark')}Sesuaikan caption tiap platform</button><button class="btn primary" onclick="smGo()">${ic('send')}Terbitkan ke ${smOn.length} platform</button></div>
      </div>
      <div class="card stack" id="smcaps"><div class="row" style="justify-content:space-between"><h3>Caption per platform</h3><span class="faint" style="font-size:12px">Bisa diedit sebelum terbit</span></div>
        <div class="tabs">${PLAT.filter(p=>smOn.includes(p[0])).map(p=>`<button class="${p[0]===smTab?'on':''}" onclick="smTab='${p[0]}';render()">${p[1]}</button>`).join('')}</div>
        <textarea id="smone" style="min-height:130px">${esc(store.get('cap:'+smTab, CAP[smTab]))}</textarea>
        <div class="faint" style="font-size:12px">${smTab==='x'?'Batas 280 karakter':smTab==='tt'?'Judul pendek, tagar di akhir':smTab==='yt'?'Judul, deskripsi, penanda waktu, tagar':smTab==='ig'?'Maks. 30 tagar':'Tanpa batas ketat'}</div></div>
    </div>
    <div class="stack">
      <div class="card"><h3>Status penerbitan</h3><div class="stack" id="smstat" style="margin-top:10px">${smOn.map(id=>{ const p = PLAT.find(x=>x[0]===id); return `<div class="pstat"><span class="pl" style="background:${p[2]};width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px">${p[3]}</span><span>${p[1]}</span><span class="chip" id="st-${id}">Menunggu</span></div>`; }).join('')}</div></div>
      <div class="card"><h3>Riwayat</h3><div class="stack" style="margin-top:10px;font-size:13px">
        <div><b>Video: Fishbone 6M dalam 3 menit</b><div class="faint">12 Nov · 5 platform · 3.412 tayangan total</div></div>
        <div><b>Foto: Seminar rancangan PKP IV</b><div class="faint">10 Nov · 4 platform · 1.208 suka total</div></div></div></div>
      <div class="ai-box"><div class="ai-head">${ic('spark')}Catatan penting</div><p style="font-size:13px">Posting dibuat dari Gho Studio. Unggahan yang dibuat langsung di aplikasi Facebook tidak bisa diteruskan otomatis ke TikTok atau platform lain, karena tiap platform tidak membagikan unggahan ke platform pesaing. Jadi biasakan mengunggah dari sini.</p></div>
    </div>
  </div>`;
window.smFile = inp => { const f = inp.files[0]; if(!f) return; smMedia = f.name + ' · ' + (f.size>1048576 ? (f.size/1048576).toFixed(1)+' MB' : Math.round(f.size/1024)+' KB'); document.getElementById('smf').textContent = smMedia;
  if(f.type.startsWith('image/') && (smOn.includes('yt')||smOn.includes('tt'))) toast('YouTube dan TikTok butuh video. Foto akan dilewati di dua platform itu'); markSaving(); };
window.smToggle = (id, on) => { smOn = on ? [...new Set([...smOn, id])] : smOn.filter(x=>x!==id); if(!smOn.includes(smTab)) smTab = smOn[0]||'fb'; store.set('smOn', smOn); render(); };
window.smCap = () => { const ta = document.getElementById('smone'); aiThinking(document.getElementById('smcaps').querySelector('.faint'), 500, () => { render(); stream(document.getElementById('smone'), CAP[smTab]); toast('Caption disesuaikan untuk '+smOn.length+' platform'); }); ta.value=''; };
window.smGo = () => { if(!smOn.length){ toast('Pilih minimal satu platform'); return; }
  smOn.forEach((id,i) => { const el = document.getElementById('st-'+id); el.className = 'chip warn'; el.textContent = 'Mengunggah…';
    setTimeout(() => { el.className = 'chip good'; el.textContent = '✓ Terbit'; }, 900 + i*600); });
  setTimeout(() => toast('Terbit di '+smOn.length+' platform'), 1000 + smOn.length*600); };


/* ---------- Peserta: materi wajib (video, audio, eBook Heyzine) ---------- */
const MATERI = [
  {id:'v', jenis:'Video', ic:'play', judul:'Nilai-nilai BerAKHLAK dalam pelayanan', dur:'08:20', aturan:'Tonton sampai selesai. Tidak bisa melompat ke bagian yang belum ditonton.'},
  {id:'a', jenis:'Audiobook', ic:'mic', judul:'Kisah ASN Adaptif di desa terpencil', dur:'06:05', aturan:'Dengarkan sampai selesai. Tidak bisa melompat ke depan.'},
  {id:'e', jenis:'eBook (Heyzine)', ic:'book', judul:'Modul Agenda 2: BerAKHLAK', dur:'8 halaman', aturan:'Buka semua halaman, minimal 20 detik per halaman.'},
  {id:'k', jenis:'Kuis cek pemahaman', ic:'quiz', judul:'Kuis Agenda 2', dur:'8 soal', aturan:'Terbuka setelah semua materi selesai.'}
];
const mDone = () => store.get('mDone', {});
let mSel = null, mProg = {v:0, a:0, vmax:0, amax:0}, mIv = null, ePg = 1, eSeen = {1:true}, eTime = {};
const MRATIOS = ['16:9','4:3','1:1','9:16','21:9'];
const mRatio = () => store.get('mRatio', '16:9');
window.mSetRatio = v => { store.set('mRatio', v); render(); };
const unlocked = i => i===0 || MATERI.slice(0,i).every(m => mDone()[m.id]);
V['pes-materi'] = () => { const d = mDone(); if(mSel===null){ mSel = MATERI.findIndex((m,i)=>!d[m.id]); if(mSel<0) mSel = 0; } const m = MATERI[mSel];
  clearInterval(mIv);
  let pane = '';
  if(m.id==='v' || m.id==='a'){ const pct = mProg[m.id], mx = mProg[m.id+'max']; const rt = mRatio();
    pane = `<div class="player">${m.id==='v'?`<div class="screen" style="aspect-ratio:${rt}">▶ ${m.judul}<br><span style="font-size:12px;font-weight:500;opacity:.7">Pemutar video (YouTube atau server sendiri) · ${rt}</span></div>`:`<div class="screen" style="aspect-ratio:auto;padding:28px">🎧 ${m.judul}</div>`}
      <div class="ctl"><button onclick="mPlay('${m.id}')" aria-label="Putar atau jeda" id="mpb">${ic('play')}</button>
      <div class="seek" onclick="mSeek(event,'${m.id}')"><span class="mx" style="width:${mx}%"></span><span class="cur" id="mcur" style="width:${pct}%"></span></div>
      <span class="mono" style="font-size:12px" id="mpct">${Math.round(pct)}%</span></div></div>
      ${m.id==='v'?`<div class="row" style="margin-top:8px;flex-wrap:nowrap;align-items:center;gap:8px"><span class="faint" style="font-size:12px">Ukuran tampilan (diatur fasilitator, simulasi):</span><select style="width:auto" onchange="mSetRatio(this.value)">${MRATIOS.map(r=>`<option ${r===rt?'selected':''}>${r}</option>`).join('')}</select></div>`:''}`;
  } else if(m.id==='e'){
    pane = `<div class="flip"><div class="row" style="justify-content:space-between;width:100%"><span class="chip ai">Flipbook Heyzine</span><span class="mono faint">Halaman ${ePg}/8 · dibuka ${Object.keys(eSeen).length}/8</span></div>
      <div class="pg"><b>${ePg===1?'Modul Agenda 2':'Bab '+(ePg-1)}</b>${'<i></i>'.repeat(9)}<i style="width:60%"></i></div>
      <div class="row"><button class="btn sm" onclick="ePage(-1)">‹ Sebelumnya</button><button class="btn sm primary" onclick="ePage(1)">Berikutnya ›</button></div>
      <span class="faint" style="font-size:12px">Di aplikasi asli, flipbook Heyzine dipasang dengan iframe dan halaman yang dibuka dicatat.</span></div>`;
  } else {
    pane = unlocked(3) ? `<div class="card" style="text-align:center"><p>Semua materi selesai. Kuis sudah terbuka.</p><button class="btn primary" style="margin-top:10px" onclick="go('pes-kuis')">Mulai kuis</button></div>`
      : `<div class="empty">${ic('lock').replace('<svg','<svg style="width:22px;height:22px"')}<p style="margin-top:6px">Selesaikan semua materi di atas untuk membuka kuis.</p></div>`;
  }
  return `
  ${proto}
  <div class="crumb"><b>Latsar CPNS Angkatan XII</b>›<span>Agenda 2 · Nilai-nilai Dasar PNS</span>›<span>Berorientasi Pelayanan</span></div>
  <div class="head"><div><h1>Materi wajib</h1><p class="muted">Selesaikan berurutan. Aktivitas berikutnya terbuka setelah materi sebelumnya ditonton, didengar, atau dibaca sampai selesai.</p></div>
  <button class="btn sm ghost" onclick="store.set('mDone',{});mProg={v:0,a:0,vmax:0,amax:0};eSeen={1:true};ePg=1;mSel=null;render()">Ulangi demo</button></div>
  <div class="split rev">
    <div class="path">${MATERI.map((x,i)=>{ const ok = d[x.id], lk = !unlocked(i);
      return `<button class="pstep ${ok?'done':''} ${i===mSel?'on':''} ${lk?'lock':''}" onclick="${lk?`toast('Selesaikan materi sebelumnya dulu')`:`mSel=${i};render()`}">
        <span class="ix">${ic(ok?'check':lk?'lock':x.ic)}</span><span class="grow"><b style="font-size:13.5px">${x.jenis}</b><div class="faint" style="font-size:12px">${x.judul} · ${x.dur}</div></span>
        ${ok?'<span class="chip good">Selesai</span>':lk?'<span class="chip">Terkunci</span>':'<span class="chip accent">Kerjakan</span>'}</button>`; }).join('')}</div>
    <div class="stack"><div class="card stack"><div class="row" style="justify-content:space-between"><div><div class="label">${m.jenis}</div><h2 style="margin-top:2px">${m.judul}</h2></div>${d[m.id]?'<span class="chip good">✓ Selesai</span>':''}</div>
      ${pane}<div class="faint" style="font-size:12.5px">${ic('lock').replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')} ${m.aturan}</div></div></div>
  </div>`; };
window.mPlay = id => { if(mIv){ clearInterval(mIv); mIv = null; document.getElementById('mpb').innerHTML = ic('play'); return; }
  document.getElementById('mpb').innerHTML = '❚❚';
  mIv = setInterval(() => { const cur = document.getElementById('mcur'); if(!cur){ clearInterval(mIv); mIv=null; return; }
    mProg[id] = Math.min(100, mProg[id] + (reduce?25:2.5)); mProg[id+'max'] = Math.max(mProg[id+'max'], mProg[id]);
    cur.style.width = mProg[id]+'%'; cur.previousElementSibling.style.width = mProg[id+'max']+'%'; document.getElementById('mpct').textContent = Math.round(mProg[id])+'%';
    if(mProg[id] >= 100){ clearInterval(mIv); mIv = null; const d = mDone(); d[id] = true; store.set('mDone', d); markSaving(); toast('Selesai. Materi berikutnya terbuka'); mSel++; render(); } }, 120); };
window.mSeek = (e, id) => { const r = e.currentTarget.getBoundingClientRect(); const to = (e.clientX - r.left) / r.width * 100;
  if(to > mProg[id+'max'] + 1){ toast('Belum bisa melompat ke bagian yang belum ditonton'); return; }
  mProg[id] = to; document.getElementById('mcur').style.width = to+'%'; document.getElementById('mpct').textContent = Math.round(to)+'%'; };
window.ePage = dlt => { ePg = Math.max(1, Math.min(8, ePg + dlt)); eSeen[ePg] = true;
  if(Object.keys(eSeen).length === 8 && ePg === 8){ const d = mDone(); d.e = true; store.set('mDone', d); markSaving(); toast('Semua halaman dibaca. Kuis terbuka'); mSel = 3; }
  render(); };


/* ---------- Fasilitator: struktur kelas (Pelatihan > Agenda > Mata Pelatihan > Aktivitas) ---------- */
const TREE = {n:'Latsar CPNS Angkatan XII', j:'3 Nov – 20 Des', c:[
  {n:'Agenda 1 · Sikap Perilaku Bela Negara', j:'3 – 7 Nov', c:[{n:'Wawasan Kebangsaan', j:'3 – 4 Nov', a:[['Video','Video materi'],['Kuis','Kuis 10 soal']]},{n:'Analisis Isu Kontemporer', j:'5 – 6 Nov', a:[['Studi kasus interaktif','Isu hoaks di media sosial']]},{n:'Kesiapsiagaan Bela Negara', j:'7 Nov', a:[['Refleksi','Refleksi harian']]}]},
  {n:'Agenda 2 · Nilai-nilai Dasar PNS', j:'10 – 21 Nov', c:[{n:'Berorientasi Pelayanan', j:'10 – 12 Nov', a:[['Video','BerAKHLAK dalam pelayanan'],['Audiobook','Kisah ASN Adaptif'],['eBook (Heyzine)','Modul Agenda 2'],['Kuis','Kuis 8 soal, 8 bentuk'],['Studi kasus interaktif','Antrean puskesmas']]},{n:'Akuntabel', j:'13 – 14 Nov', a:[['Dilema etik BerAKHLAK','Titipan berkas'],['Kuis','Kuis 10 soal']]},{n:'Kompeten', j:'17 Nov', a:[['Tugas tulis','Rencana belajar mandiri']]}]},
  {n:'Agenda 3 · Kedudukan dan Peran PNS', j:'24 – 28 Nov', c:[{n:'Smart ASN', j:'24 – 25 Nov', a:[['Materi bacaan','4 pilar literasi digital'],['Kuis','Kuis 10 soal']]},{n:'Manajemen ASN', j:'26 – 28 Nov', a:[['Diskusi','Sistem merit']]}]},
  {n:'Agenda 4 · Habituasi', j:'1 – 20 Des', c:[{n:'Rancangan Aktualisasi', j:'1 – 5 Des', a:[['Rancangan bertahap','Bagian I–VI (coach)']]}]}
]};
const seq = (k, def=true) => { const v = store.get('seq', {}); return k in v ? v[k] : def; };
window.setSeq = (k, on) => { const v = store.get('seq', {}); v[k] = on; store.set('seq', v); toast(on ? 'Wajib berurutan: item ini terkunci sampai item sebelumnya selesai' : 'Keterkaitan dimatikan: item ini bisa dibuka kapan saja'); markSaving(); };
const swq = (k, label='Berurutan') => `<label class="sw" onclick="event.stopPropagation()"><input type="checkbox" ${seq(k)?'checked':''} onchange="setSeq('${k}',this.checked)">${label}</label>`;
const jad = j => `<span class="chip mono">${ic('cal').replace('<svg','<svg style="width:12px;height:12px"')} ${j}</span>`;
V['fas-struktur'] = () => `
  <div class="head"><div><h1>Struktur kelas</h1><p class="muted">Pelatihan › Agenda › Mata Pelatihan › Aktivitas. Setiap tingkat punya jadwal buka dan tutup. Bawaannya berurutan: yang pertama wajib selesai dulu. Keterkaitan bisa Anda matikan per item.</p></div>
  <button class="btn primary" onclick="toast('Tambah agenda, mata pelatihan, atau aktivitas (simulasi)')">+ Tambah</button></div>
  <div class="split">
    <div class="card tree">
      <details open><summary><span class="lv">Pelatihan</span><span class="nm">${TREE.n}</span>${jad(TREE.j)}${swq('P','Agenda berurutan')}</summary>
      ${TREE.c.map((ag,i)=>`<details ${i===1?'open':''}><summary><span class="lv">Agenda ${i+1}</span><span class="nm">${ag.n.split(' · ')[1]}</span>${jad(ag.j)}${swq('A'+i,'Berurutan')}</summary>
        ${ag.c.map((mp,m)=>`<details ${i===1&&m===0?'open':''}><summary><span class="lv">Mata pelatihan</span><span class="nm">${mp.n}</span>${jad(mp.j)}${swq('M'+i+m,'Berurutan')}</summary>
          ${mp.a.map((a,x)=>`<div class="act"><span class="chip ${x===0||!seq('X'+i+m+x)?'good':''}">${x===0||!seq('X'+i+m+x)?'Terbuka':ic('lock').replace('<svg','<svg style="width:11px;height:11px"')+' Setelah no. '+x}</span><span class="nm"><b>${x+1}. ${a[0]}</b> <span class="muted">· ${a[1]}</span></span>${x?swq('X'+i+m+x,'Wajib setelah sebelumnya'):''}</div>`).join('')}
        </details>`).join('')}
      </details>`).join('')}
      </details>
    </div>
    <div class="stack">
      <div class="card"><h3>Aturan keterkaitan</h3><div class="stack muted" style="margin-top:8px;font-size:13px">
        <div>• <b>Berurutan (bawaan):</b> item terbuka setelah item sebelumnya di tingkat yang sama selesai.</div>
        <div>• <b>Dimatikan:</b> item bisa dikerjakan kapan saja selama jadwalnya buka.</div>
        <div>• <b>Jadwal:</b> item hanya bisa dibuka di antara waktu buka dan tutup. Jadwal tingkat bawah tidak boleh melewati tingkat di atasnya.</div>
        <div>• <b>Selesai</b> berarti: video dan audio diputar sampai habis, eBook semua halaman dibaca, kuis lulus, tugas terkirim.</div></div></div>
      <div class="card"><h3>Pratinjau peserta</h3><p class="muted" style="font-size:13px;margin-top:4px">Lihat bagaimana urutan ini dirasakan peserta.</p><button class="btn" style="margin-top:10px" onclick="go('pes-materi')">${ic('play')}Buka sebagai peserta</button></div>
    </div>
  </div>`;

/* ---------- render ---------- */
function render(){
  const r = S.role;
  let v = location.hash.slice(1);
  if(!V[v] || !v.startsWith(r==='coach'?'coach':r)) v = S.view[r];
  S.view[r] = v; store.set('state', S);
  document.querySelectorAll('.roles button').forEach(b => b.classList.toggle('on', b.dataset.role===r));
  const link = n => `<a href="#${n[0]}" class="${n[0]===v?'on':''}">${ic(n[2])}<span>${n[1]}</span></a>`;
  const links = NAV[r].map(n => (n[3]?`<div class="grp">${n[3]}</div>`:'') + link(n)).join('');
  document.getElementById('nav').innerHTML = links;
  const main4 = NAV[r].slice(0,4), rest = NAV[r].slice(4);
  const inRest = rest.some(n=>n[0]===v);
  document.getElementById('bnav').innerHTML = main4.map(link).join('') + (rest.length ? `<button class="${inRest?'on':''}" onclick="document.getElementById('sheet').hidden=false" aria-label="Menu lainnya">${ic('grid')}<span>Lainnya</span></button>` : '');
  document.getElementById('sheetnav').innerHTML = links;
  document.getElementById('sheet').hidden = true;
  document.getElementById('avatar').textContent = PERSON[r];
  document.getElementById('view').innerHTML = V[v]();
  clearInterval(pollIv);
  if(v==='fas-live'){ drawPoll(); pollIv = setInterval(() => { const p = POLL[Math.floor(Math.random()*POLL.length)]; p[1]++; drawPoll();
    const j = document.getElementById('joined'); if(j){ const n = parseInt(j.textContent); if(n<38 && Math.random()<.4) j.textContent = (n+1)+' peserta'; } }, 1400); }
}
document.querySelectorAll('.roles button').forEach(b => b.onclick = () => setRole(b.dataset.role));
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1); const pre = v.split('-')[0];
  const role = ['coach','fas','cms','pes'].includes(pre)?pre:S.role;
  S.role = role; render(); window.scrollTo(0,0);
});

/* tema */
function setThemeIcon(){ const dark = document.documentElement.dataset.theme==='dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme').innerHTML = ic(dark?'sun':'moon'); }
document.getElementById('theme').onclick = () => { const dark = document.documentElement.dataset.theme==='dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; setThemeIcon(); };
setThemeIcon();
if(location.hash.length>1){ const pre = location.hash.slice(1).split('-')[0]; if(['coach','fas','cms','pes'].includes(pre)) S.role = pre; }
render();
</script>
